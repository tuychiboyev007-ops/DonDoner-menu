<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>DonDöner — Admin</title>
<style>
  :root {
    --brand: #d81327;
    --bg: #f2f3f5;
    --card: #ffffff;
    --text: #16181c;
    --muted: #8a8f98;
    --line: rgba(120, 120, 130, 0.22);
    --ok: #1f9d55;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0e10;
      --card: #1b1c1f;
      --text: #f3f3f3;
      --muted: #9a9ba0;
      --line: rgba(255, 255, 255, 0.14);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font-family: inherit; }

  /* ---------- Sarlavha ---------- */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: #000; color: #fff;
    padding: calc(env(safe-area-inset-top) + 12px) 14px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .top__back {
    width: 40px; height: 40px; flex-shrink: 0;
    border: none; background: rgba(255,255,255,.12); color: #fff;
    border-radius: 12px; font-size: 20px; cursor: pointer;
  }
  .top__title { flex: 1; min-width: 0; }
  .top__title b { display: block; font-size: 17px; font-weight: 800; }
  .top__title span { display: block; font-size: 11px; color: #9a9a9a; margin-top: 1px; }

  main { max-width: 640px; margin: 0 auto; padding: 14px 14px calc(env(safe-area-inset-bottom) + 40px); }

  /* ---------- Kirish ---------- */
  .login { max-width: 300px; margin: 15vh auto; text-align: center; padding: 0 20px; }
  .login__logo { font-size: 52px; }
  .login h2 { font-size: 21px; margin: 6px 0 2px; }
  .login p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .login input {
    width: 100%; padding: 16px; font-size: 26px; text-align: center;
    border: 2px solid var(--line); border-radius: 14px;
    background: var(--card); color: var(--text); letter-spacing: 8px; outline: none;
  }
  .login input:focus { border-color: var(--brand); }
  .err { color: #ff5c5c; font-size: 13px; min-height: 20px; margin-top: 10px; }

  /* ---------- Tugmalar ---------- */
  .btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px;
    background: var(--brand); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .btn:active { transform: scale(0.985); }
  .btn--add {
    background: var(--card); color: var(--brand);
    border: 2px dashed rgba(216,19,39,.45); margin-top: 4px;
  }
  .btn--del { background: transparent; color: #e03131; border: 1.5px solid rgba(224,49,49,.4); margin-top: 20px; }
  .btn--mini { width: auto; padding: 9px 14px; font-size: 13px; border-radius: 10px; }

  /* ---------- Ro'yxat qatorlari ---------- */
  .list { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 14px; }
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 14px 15px; border: none; background: transparent; color: var(--text);
    border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; font-size: 16px;
  }
  .row:last-child { border-bottom: none; }
  .row:active { background: rgba(130,130,140,.1); }
  .row__ico { font-size: 24px; width: 34px; text-align: center; flex-shrink: 0; }
  .row__mid { flex: 1; min-width: 0; }
  .row__mid b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row__mid span { display: block; font-size: 13px; color: var(--muted); }
  .row__arrow { color: var(--muted); font-size: 22px; flex-shrink: 0; }
  .row__thumb {
    width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0; overflow: hidden;
    background: rgba(130,130,140,.14); display: grid; place-items: center; font-size: 20px;
  }
  .row__thumb img { width: 100%; height: 100%; object-fit: cover; }

  .title { font-size: 13px; font-weight: 700; color: var(--muted);
           text-transform: uppercase; letter-spacing: .04em; margin: 22px 4px 8px; }

  /* ---------- Forma ---------- */
  .card { background: var(--card); border-radius: 16px; padding: 15px; margin-bottom: 14px; }
  .f { margin-bottom: 14px; }
  .f:last-child { margin-bottom: 0; }
  .f label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .f input, .f textarea {
    width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--text); font-size: 16px; outline: none;
  }
  .f input:focus, .f textarea:focus { border-color: var(--brand); background: var(--card); }
  .f textarea { resize: vertical; min-height: 62px; }
  .f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

  /* Rasm yuklash */
  .photo {
    position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 14px; overflow: hidden;
    background: rgba(130,130,140,.14); display: grid; place-items: center; cursor: pointer;
    border: 2px dashed var(--line);
  }
  /* Rasm kvadrat maydonga to'liq sig'adi — kesilmaydi */
  .photo img { width: 100%; height: 100%; object-fit: contain; }
  .photo__hint { text-align: center; color: var(--muted); font-size: 14px; padding: 10px; }
  .photo__hint b { display: block; font-size: 34px; margin-bottom: 4px; }
  .photo__badge {
    position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.65); color: #fff;
    font-size: 12px; padding: 6px 10px; border-radius: 8px;
  }

  /* Segmentli tanlov */
  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; padding: 12px 8px; border: 1.5px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .seg button.on { border-color: var(--brand); background: rgba(216,19,39,.09); color: var(--brand); }

  /* Tugagan mahsulot ro'yxatda */
  .row--out .row__thumb { opacity: .45; }
  .warn {
    border: 1.5px solid rgba(247,127,0,.45); background: rgba(247,127,0,.09);
  }
  .warn b { display: block; font-size: 15px; margin-bottom: 4px; }
  .warn p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }

  .row__out--noprice { background: rgba(247,127,0,.15); color: #b25b00; }
  .row__out {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
    background: rgba(224,49,49,.12); color: #e03131; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .03em; vertical-align: middle;
  }

  /* Hisobot — ixcham qatorlar */
  .rrow {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 15px; border-bottom: 1px solid var(--line);
  }
  .rrow:last-child { border-bottom: none; }
  .rrow__ico { font-size: 21px; width: 30px; text-align: center; flex-shrink: 0; }
  .rrow__mid { flex: 1; min-width: 0; }
  .rrow__mid b { display: block; font-size: 15px; font-weight: 600;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow__mid span { display: block; font-size: 12px; color: var(--muted); }
  .rrow__sum { font-size: 17px; font-weight: 800; flex-shrink: 0; white-space: nowrap; }
  .rrow--sum { background: rgba(216,19,39,.06); }
  .rrow--sum .rrow__sum { color: var(--brand); }

  /* O'lchamlar */
  .vrow { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .vrow input { padding: 12px; border: 1.5px solid var(--line); border-radius: 11px;
                background: var(--bg); color: var(--text); font-size: 15px; outline: none; min-width: 0; }
  .vrow input:focus { border-color: var(--brand); }
  .vrow .vl { flex: 1; }
  .vrow .vp { width: 108px; flex-shrink: 0; }
  .vrow .vx {
    width: 40px; height: 40px; flex-shrink: 0; border: none; border-radius: 10px;
    background: rgba(224,49,49,.12); color: #e03131; font-size: 17px; cursor: pointer;
  }

  /* Saqlash holati */
  .saved { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #6b7280; flex-shrink: 0; }
  .dot.on { background: #f59e0b; }
  .dot.ok { background: #22c55e; }
  .dot.bad { background: #ef4444; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 10px);
    background: #16181c; color: #fff; padding: 12px 20px; border-radius: 12px;
    font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .2s;
    pointer-events: none; z-index: 90; max-width: 88%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .empty { text-align: center; color: var(--muted); padding: 30px 16px; font-size: 15px; }
  [hidden] { display: none !important; }

  /* ---------- Rasmni kesish oynasi ---------- */
  .crop {
    position: fixed; inset: 0; z-index: 200; background: #000; color: #fff;
    display: flex; flex-direction: column;
  }
  .crop__head { padding: calc(env(safe-area-inset-top) + 18px) 20px 6px; text-align: center; }
  .crop__head h2 { margin: 0; font-size: 18px; font-weight: 800; }
  .crop__head p { margin: 4px 0 0; font-size: 12px; color: #9a9a9a; }
  .crop__stage {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    position: relative; touch-action: none; padding: 14px;
  }
  .crop__frame {
    position: relative; width: min(84vw, 420px); aspect-ratio: 1 / 1;
    overflow: hidden; border-radius: 14px;
    box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.78);
  }
  .crop__frame img {
    position: absolute; top: 0; left: 0; transform-origin: 0 0;
    will-change: transform; -webkit-user-drag: none; user-select: none;
    pointer-events: none; max-width: none;
  }
  .crop__grid { position: absolute; inset: 0; pointer-events: none; }
  .crop__grid::before, .crop__grid::after {
    content: ""; position: absolute; background: rgba(255, 255, 255, 0.45);
  }
  .crop__grid::before { left: 33.333%; top: 0; width: 1px; height: 100%; box-shadow: 33.333% 0 0 rgba(255, 255, 255, 0.45); }
  .crop__grid::after { top: 33.333%; left: 0; height: 1px; width: 100%; box-shadow: 0 33.333% 0 rgba(255, 255, 255, 0.45); }
  .crop__controls { display: flex; align-items: center; gap: 12px; padding: 10px 26px; }
  .crop__controls input[type="range"] { flex: 1; accent-color: var(--brand); }
  .crop__zicon { font-size: 15px; color: #9a9a9a; width: 16px; text-align: center; flex-shrink: 0; }
  .crop__actions {
    display: flex; gap: 10px; padding: 6px 20px calc(env(safe-area-inset-bottom) + 18px);
  }
  .crop__actions .btn { margin: 0; }
  .crop__cancel { background: rgba(255, 255, 255, 0.12); color: #fff; }
</style>
</head>
<body>

<!-- ===== KIRISH ===== -->
<div class="login" id="loginBox">
  <div class="login__logo">🔒</div>
  <h2>DonDöner Admin</h2>
  <p>PIN kodni kiriting</p>
  <input id="pinInput" inputmode="numeric" maxlength="8" placeholder="••••••" autocomplete="off" />
  <button class="btn" id="pinBtn" style="margin-top:14px">Kirish</button>
  <p class="err" id="loginErr"></p>
</div>

<!-- ===== PANEL ===== -->
<div id="app" hidden>
  <div class="top">
    <button class="top__back" id="backBtn" hidden>←</button>
    <div class="top__title">
      <b id="topTitle">DonDöner Admin</b>
      <span class="saved"><i class="dot" id="saveDot"></i><i id="saveText">tayyor</i></span>
    </div>
    <button class="top__back" id="saveBtn" title="Saqlash">💾</button>
  </div>
  <main id="screen"></main>
</div>

<div class="toast" id="toast"></div>

<!-- ===== RASMNI KESISH ===== -->
<div class="crop" id="cropOverlay" hidden>
  <div class="crop__head">
    <h2>Rasmni kesing</h2>
    <p>Suring · zoom qiling · ramkaga moslang (1:1)</p>
  </div>
  <div class="crop__stage" id="cropStage">
    <div class="crop__frame" id="cropFrame">
      <img id="cropImg" draggable="false" alt="" />
      <div class="crop__grid"></div>
    </div>
  </div>
  <div class="crop__controls">
    <span class="crop__zicon">－</span>
    <input type="range" id="cropZoom" min="0" max="100" value="0" />
    <span class="crop__zicon">＋</span>
  </div>
  <div class="crop__actions">
    <button class="btn crop__cancel" id="cropCancel">Bekor</button>
    <button class="btn" id="cropConfirm">✂️ Kesish</button>
  </div>
</div>

<script src="data/menu.js"></script>
<script>
(function () {
  "use strict";

  /* ============================================================
     DonDöner admin panel — ekran-ekran navigatsiya
     home → kategoriya → mahsulot
     ============================================================ */

  var PIN_KEY = "dondoner_admin_pin";
  var pin = sessionStorage.getItem(PIN_KEY) || "";
  var MENU = null;
  var promos = null;          // chegirma kodlari (serverdan yuklanadi)
  var followup = null;        // «qaytib keling» eslatmasi sozlamalari
  var report = null;          // bugungi hisobot (filiallar bo'yicha)
  var view = { name: "home", ci: 0, ii: 0 };
  var saveTimer = null;

  /* ---------- Yordamchilar ---------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function money(n) {
    return String(n || 0).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 1900);
  }
  function uid() {
    return Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 5);
  }
  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/gi, "-")
      .replace(/^-+|-+$/g, "").slice(0, 30) || "item";
  }
  function minPrice(item) {
    if (item.variants && item.variants.length) {
      return Math.min.apply(null, item.variants.map(function (v) { return v.price || 0; }));
    }
    return item.price || 0;
  }
  /* Tugagan taom filiallar ro'yxati bilan belgilanadi: item.outAt = ["b1"].
     Eski `item.out = true` — hamma filialda tugagan degani. */
  function itemOutAt(item, branchId) {
    if (item.out === true && !item.outAt) return true;
    return (item.outAt || []).indexOf(branchId) !== -1;
  }

  function setItemOutAt(item, branchId, out) {
    var brs = (MENU.restaurant.branches || []).map(function (b) { return b.id || ""; });
    // Eski formatni yangisiga o'tkazamiz
    if (item.out === true && !item.outAt) item.outAt = brs.slice();
    delete item.out;
    var list = item.outAt || [];
    var i = list.indexOf(branchId);
    if (out && i === -1) list.push(branchId);
    if (!out && i !== -1) list.splice(i, 1);
    if (list.length) item.outAt = list;
    else delete item.outAt;
  }

  function anyOut(item) {
    if (item.out === true && !item.outAt) return true;
    return (item.outAt || []).length > 0;
  }

  // Narxi yo'q mahsulot mijozga ko'rsatilmaydi
  function isReady(item) {
    if (item.variants && item.variants.length) {
      return item.variants.some(function (v) { return Number(v.price) > 0; });
    }
    return Number(item.price) > 0;
  }

  function priceText(item) {
    var p = money(minPrice(item)) + " so'm";
    if (item.variants && item.variants.length > 1) p += " dan";
    return p;
  }

  /* ---------- Server bilan aloqa ---------- */
  function api(action, extra, cb) {
    var body = Object.assign({ action: action }, extra || {});
    fetch("/api/admin", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Pin": pin },
      body: JSON.stringify(body),
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
      .then(function (res) { cb(null, res); })
      .catch(function (e) { cb(e); });
  }

  function setSaveState(state, text) {
    var dot = document.getElementById("saveDot");
    dot.className = "dot" + (state ? " " + state : "");
    document.getElementById("saveText").textContent = text;
  }

  function scheduleSave() {
    setSaveState("on", "saqlanmoqda…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 800);
  }

  function doSave() {
    api("save_menu", { menu: MENU }, function (err, res) {
      if (err || res.status !== 200) {
        setSaveState("bad", "saqlanmadi!");
        return;
      }
      var d = new Date();
      setSaveState("ok", "saqlandi " +
        String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"));
    });
  }

  /* ---------- Kirish ---------- */
  function tryLogin() {
    var val = document.getElementById("pinInput").value.trim();
    if (!val) return;
    pin = val;
    document.getElementById("loginErr").textContent = "Tekshirilmoqda…";
    api("get_menu", {}, function (err, res) {
      if (err || res.status !== 200) {
        document.getElementById("loginErr").textContent = "PIN noto'g'ri";
        pin = "";
        return;
      }
      sessionStorage.setItem(PIN_KEY, pin);
      MENU = (res.data && res.data.menu && res.data.menu.categories)
        ? res.data.menu
        : JSON.parse(JSON.stringify(window.MENU || { restaurant: {}, categories: [] }));
      document.getElementById("loginBox").hidden = true;
      document.getElementById("app").hidden = false;
      setSaveState("", "tayyor");
      go("home");
      // Chegirma kodlari — bosh ekranda sonini ko'rsatish uchun
      loadPromos(function () { if (view.name === "home") render(); });
    });
  }

  document.getElementById("pinBtn").addEventListener("click", tryLogin);
  document.getElementById("pinInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryLogin();
  });
  document.getElementById("saveBtn").addEventListener("click", function () {
    clearTimeout(saveTimer);
    doSave();
    toast("Saqlanmoqda…");
  });

  if (pin) {
    document.getElementById("pinInput").value = pin;
    tryLogin();
  }

  /* ---------- Navigatsiya ---------- */
  function go(name, ci, ii) {
    view = { name: name, ci: ci || 0, ii: ii || 0 };
    window.scrollTo(0, 0);
    render();
  }
  document.getElementById("backBtn").addEventListener("click", function () {
    if (view.name === "item") go("cat", view.ci);
    else go("home");
  });

  function render() {
    var back = document.getElementById("backBtn");
    back.hidden = view.name === "home";
    var box = document.getElementById("screen");
    box.innerHTML = "";
    if (view.name === "home") return renderHome(box);
    if (view.name === "cat") return renderCat(box);
    if (view.name === "item") return renderItem(box);
    if (view.name === "settings") return renderSettings(box);
    if (view.name === "branches") return renderBranches(box);
    if (view.name === "promos") return renderPromos(box);
    if (view.name === "broadcast") return renderBroadcast(box);
    if (view.name === "followup") return renderFollowup(box);
  }

  function setTitle(text) {
    document.getElementById("topTitle").textContent = text;
  }

  /* ============ 1. BOSH EKRAN ============ */
  function renderHome(box) {
    setTitle("DonDöner Admin");

    box.appendChild(el("div", "title", "Sozlamalar"));
    var s = el("div", "list");
    s.appendChild(navRow("⚙️", "Restoran sozlamalari", "Nomi, ish vaqti, yetkazish", function () { go("settings"); }));
    s.appendChild(navRow("🏬", "Filiallar",
      ((MENU.restaurant.branches || []).length) + " ta filial", function () { go("branches"); }));
    s.appendChild(navRow("🏷", "Chegirma kodlari",
      promos === null ? "yuklanmoqda…" : promos.length + " ta kod", function () { go("promos"); }));
    s.appendChild(navRow("📣", "Reklama xabari",
      "Barcha mijozlarga yuborish", function () { go("broadcast"); }));
    s.appendChild(navRow("🔔", "«Qaytib keling» eslatmasi",
      "Buyurtmasiz chiqib ketganlarga", function () { go("followup"); }));
    box.appendChild(s);

    box.appendChild(el("div", "title", "Menyu — kategoriyalar"));
    var list = el("div", "list");
    (MENU.categories || []).forEach(function (cat, ci) {
      var n = (cat.items || []).length;
      list.appendChild(navRow(cat.icon || "🍽", cat.name || "(nomsiz)",
        n + " ta mahsulot", function () { go("cat", ci); }));
    });
    if (!(MENU.categories || []).length) {
      list.appendChild(el("div", "empty", "Hali kategoriya yo'q"));
    }
    box.appendChild(list);

    var add = el("button", "btn btn--add", "➕ Yangi kategoriya");
    add.addEventListener("click", function () {
      MENU.categories = MENU.categories || [];
      MENU.categories.push({ id: "cat-" + uid(), name: "Yangi kategoriya", icon: "🍽", items: [] });
      scheduleSave();
      go("cat", MENU.categories.length - 1);
    });
    box.appendChild(add);

    /* --- Eng pastda: bugungi hisobot, filiallar bo'yicha --- */
    box.appendChild(el("div", "title", "Hisobot"));
    var repBox = el("div");
    box.appendChild(repBox);
    paintReport(repBox);
  }

  var repPeriod = "today";
  var PERIOD_NAME = { today: "Bugun", week: "7 kun", month: "30 kun" };

  function paintReport(box) {
    box.innerHTML = "";

    // Davr tanlash
    var seg = el("div", "seg");
    ["today", "week", "month"].forEach(function (pd) {
      var btn = el("button", repPeriod === pd ? "on" : "", PERIOD_NAME[pd]);
      btn.addEventListener("click", function () {
        if (repPeriod === pd) return;
        repPeriod = pd;
        report = null;
        paintReport(box);
      });
      seg.appendChild(btn);
    });
    var segWrap = el("div", "card");
    segWrap.appendChild(seg);
    box.appendChild(segWrap);

    if (report === null) {
      box.appendChild(el("div", "empty", "Yuklanmoqda…"));
      api("get_report", { period: repPeriod }, function (err, res) {
        report = (!err && res.status === 200 && res.data.branches) ? res.data : false;
        paintReport(box);
      });
      return;
    }
    if (report === false) {
      box.appendChild(el("div", "empty", "Hisobotni olib bo'lmadi"));
      box.appendChild(reloadBtn(box));
      return;
    }

    function row(icon, name, info, strong) {
      return el("div", "rrow" + (strong ? " rrow--sum" : ""),
        '<span class="rrow__ico">' + icon + "</span>" +
        '<span class="rrow__mid"><b>' + esc(name) + "</b>" +
        "<span>" + info.count + " ta buyurtma</span></span>" +
        '<span class="rrow__sum">' + money(info.total) + "</span>");
    }

    var list = el("div", "list");
    (report.branches || []).forEach(function (b) {
      list.appendChild(row("🏬", b.label || "Filial", b));
    });
    if (report.other) list.appendChild(row("❔", "Filial ko'rsatilmagan", report.other));
    if ((report.branches || []).length > 1) {
      list.appendChild(row("📊", "Jami", report.all, true));
    }
    box.appendChild(list);

    // Qo'shimcha ma'lumot: eng kuchli kun va top taomlar
    var extra = [];
    if (report.best) {
      extra.push("🏆 Eng kuchli kun: " + esc(report.best.day) +
        " — " + money(report.best.total) + " so'm");
    }
    if ((report.top || []).length) {
      extra.push("🔥 " + report.top.map(function (t) {
        return esc(t.name) + " ×" + t.qty;
      }).join(", "));
    }
    if (repPeriod !== "today") {
      extra.push("📅 " + esc(report.from) + " — " + esc(report.to));
    }
    if (extra.length) {
      box.appendChild(el("p", "hint", extra.join("<br>")));
    }

    box.appendChild(reloadBtn(box));
  }

  function reloadBtn(box) {
    var b = el("button", "btn btn--add", "🔄 Yangilash");
    b.addEventListener("click", function () {
      report = null;
      paintReport(box);
    });
    return b;
  }

  function navRow(ico, title, sub, onClick) {
    var b = el("button", "row",
      '<span class="row__ico">' + esc(ico) + "</span>" +
      '<span class="row__mid"><b>' + esc(title) + "</b><span>" + esc(sub) + "</span></span>" +
      '<span class="row__arrow">›</span>');
    b.addEventListener("click", onClick);
    return b;
  }

  /* ============ 3. MAHSULOT ============ */
  function renderItem(box) {
    var cat = MENU.categories[view.ci];
    if (!cat) return go("home");
    var item = (cat.items || [])[view.ii];
    if (!item) return go("cat", view.ci);
    setTitle(item.name || "Mahsulot");

    /* --- Rasm --- */
    var photo = el("div", "photo");
    function paintPhoto() {
      photo.innerHTML = item.image
        ? '<img src="' + esc(item.image) + '" /><span class="photo__badge">Almashtirish</span>'
        : '<div class="photo__hint"><b>📷</b>Rasm yuklash uchun bosing</div>';
      photo.appendChild(fileInput);
    }
    var fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.hidden = true;
    fileInput.addEventListener("change", function () {
      var f = fileInput.files[0];
      if (!f) return;
      openCropper(f, function (url) {
        if (!url) { paintPhoto(); return toast("❌ Rasm yuklanmadi"); }
        item.image = url;
        paintPhoto();
        scheduleSave();
        toast("Rasm yuklandi ✅");
      });
    });
    photo.addEventListener("click", function (e) {
      if (e.target === fileInput) return;
      fileInput.value = "";
      fileInput.click();
    });
    paintPhoto();
    var photoCard = el("div", "card");
    photoCard.appendChild(photo);
    if (item.image) {
      var rm = el("button", "btn btn--mini", "Rasmni o'chirish");
      rm.style.cssText = "margin-top:10px;background:transparent;color:#e03131;border:1.5px solid rgba(224,49,49,.4)";
      rm.addEventListener("click", function () {
        item.image = "";
        scheduleSave();
        render();
      });
      photoCard.appendChild(rm);
    }
    box.appendChild(photoCard);

    /* --- Nomi va tarkibi --- */
    var main = el("div", "card");
    main.innerHTML =
      '<div class="f"><label>Nomi</label><input id="iName" value="' + esc(item.name || "") + '" /></div>' +
      '<div class="f"><label>Tarkibi (ixtiyoriy)</label><textarea id="iDesc" rows="2">' + esc(item.desc || "") + "</textarea></div>" +
      '<div class="f"><label>Og\'irligi yoki hajmi (ixtiyoriy)</label><input id="iWeight" value="' + esc(item.weight || "") + '" placeholder="420 g / 0.5 L" /></div>';
    box.appendChild(main);
    main.querySelector("#iName").addEventListener("input", function (e) {
      item.name = e.target.value; setTitle(item.name || "Mahsulot"); scheduleSave();
    });
    main.querySelector("#iDesc").addEventListener("input", function (e) {
      item.desc = e.target.value; scheduleSave();
    });
    main.querySelector("#iWeight").addEventListener("input", function (e) {
      item.weight = e.target.value; scheduleSave();
    });

    /* --- Narx kiritilmagan bo'lsa ogohlantiramiz --- */
    if (!isReady(item)) {
      var warn = el("div", "card warn",
        "<b>⚠️ Narx kiritilmagan</b><p>Narx qo'yilmaguncha bu mahsulot mijozlarga " +
        "ko'rinmaydi. Pastdan narxini yozing.</p>");
      box.appendChild(warn);
    }

    /* --- Bor / tugadi (har filial uchun alohida) --- */
    var stockCard = el("div", "card");
    var brs = MENU.restaurant.branches || [];

    if (brs.length > 1) {
      stockCard.appendChild(el("div", "f", "<label>Holati — filial bo'yicha</label>"));
      brs.forEach(function (br) {
        var bid = br.id || "";
        var row = el("div", "f");
        row.appendChild(el("label", null, esc(br.label || "Filial")));
        var seg = el("div", "seg");
        [{ out: false, text: "✅ Bor" }, { out: true, text: "🚫 Tugadi" }].forEach(function (o) {
          var isOut = itemOutAt(item, bid);
          var btn = el("button", isOut === o.out ? "on" : "", o.text);
          btn.addEventListener("click", function () {
            setItemOutAt(item, bid, o.out);
            scheduleSave();
            render();
          });
          seg.appendChild(btn);
        });
        row.appendChild(seg);
        stockCard.appendChild(row);
      });
      stockCard.appendChild(el("p", "hint",
        "Har filial o'zining tugagan taomini alohida belgilaydi. Hamma filialda tugagan bo'lsa, " +
        "taom menyuda kulrang ko'rinadi."));
    } else {
      var bid1 = (brs[0] || {}).id || "";
      var stockF = el("div", "f", "<label>Holati</label>");
      var stockSeg = el("div", "seg");
      [{ out: false, text: "✅ Bor" }, { out: true, text: "🚫 Tugadi" }].forEach(function (o) {
        var btn = el("button", itemOutAt(item, bid1) === o.out ? "on" : "", o.text);
        btn.addEventListener("click", function () {
          setItemOutAt(item, bid1, o.out);
          scheduleSave();
          render();

        stockSeg.appendChild(btn);

        "«Tugadi» tanlansa mijoz uni ko'radi, lekin savatga qo'sha olmaydi."));
      stockCard.appendChild(stockF);
    }
    box.appendChild(stockCard);

    /* --- Narx: bitta yoki o'lchamlar --- */
    var hasV = !!(item.variants && item.variants.length);
    var priceCard = el("div", "card");
    priceCard.appendChild(el("div", "f",
      '<label>Narx turi</label>' +
      '<div class="seg">' +
      '<button id="segOne" class="' + (hasV ? "" : "on") + '">Bitta narx</button>' +
      '<button id="segMany" class="' + (hasV ? "on" : "") + '">O\'lchamlar</button>' +
      "</div>" +
      '<p class="hint">O\'lchamlar — pitsa (Kichik/O\'rta/Katta) yoki Oddiy/Set kabi variantlar uchun</p>'));
    var priceBody = el("div");
    priceCard.appendChild(priceBody);
    box.appendChild(priceCard);

    function paintPrice() {
      priceBody.innerHTML = "";
      if (item.variants && item.variants.length) {
        item.variants.forEach(function (v, vi) {
          var r = el("div", "vrow",
            '<input class="vl" placeholder="Nomi (Katta)" value="' + esc(v.label || "") + '" />' +
            '<input class="vp" inputmode="numeric" placeholder="Narx" value="' + (v.price || "") + '" />' +
            '<button class="vx">✕</button>');
          var inputs = r.querySelectorAll("input");
          inputs[0].addEventListener("input", function (e) { v.label = e.target.value; scheduleSave(); });
          inputs[1].addEventListener("input", function (e) { v.price = parseInt(e.target.value, 10) || 0; scheduleSave(); });
          r.querySelector(".vx").addEventListener("click", function () {
            item.variants.splice(vi, 1);
            if (!item.variants.length) { item.price = 0; delete item.variants; }
            scheduleSave();
            render();
          });
          priceBody.appendChild(r);
        });
        var addV = el("button", "btn btn--add", "➕ O'lcham qo'shish");
        addV.addEventListener("click", function () {
          item.variants.push({ label: "", price: 0 });
          scheduleSave();
          paintPrice();
        });
        priceBody.appendChild(addV);
      } else {
        var f = el("div", "f2");
        f.innerHTML =
          '<div class="f"><label>Narx (so\'m)</label><input id="iPrice" inputmode="numeric" value="' + (item.price || "") + '" /></div>' +
          '<div class="f"><label>Eski narx (chegirma)</label><input id="iOld" inputmode="numeric" value="' + (item.oldPrice || "") + '" placeholder="—" /></div>';
        priceBody.appendChild(f);
        f.querySelector("#iPrice").addEventListener("input", function (e) {
          item.price = parseInt(e.target.value, 10) || 0; scheduleSave();
        });
        f.querySelector("#iOld").addEventListener("input", function (e) {
          var v = parseInt(e.target.value, 10);
          if (v) item.oldPrice = v; else delete item.oldPrice;
          scheduleSave();
        });
      }
    }
    paintPrice();

    priceCard.querySelector("#segOne").addEventListener("click", function () {
      if (!item.variants) return;
      item.price = minPrice(item);
      delete item.variants;
      scheduleSave();
      render();
    });
    priceCard.querySelector("#segMany").addEventListener("click", function () {
      if (item.variants) return;
      item.variants = [{ label: "Kichik", price: item.price || 0 }];
      delete item.price;
      scheduleSave();
      render();
    });

    /* --- Qo'shimchalar (extra sir, sous ...) --- */

    adCard.appendChild(el("div", "f",
      "<label>Qo'shimchalar</label>" +
      '<p class="hint">Mijoz taom oynasida belgilaydi, narxi asosiy narxga qo\'shiladi. ' +
      "Masalan: «Extra sir» 5000, «Achchiq sous» 2000.</p>"));
    var adBody = el("div");

    function paintAddons() {
      adBody.innerHTML = "";
      var list = item.addons || [];
      list.forEach(function (a, ai) {
        var r = el("div", "vrow",
          '<input class="vl" placeholder="Nomi (Extra sir)" value="' + esc(a.name || "") + '" />' +
          '<input class="vp" inputmode="numeric" placeholder="Narx" value="' + (a.price || "") + '" />' +
          '<button class="vx">✕</button>');
        var inp = r.querySelectorAll("input");
        inp[0].addEventListener("input", function (e) {
          a.name = e.target.value;
          if (!a.id) a.id = "ad" + uid();
          scheduleSave();
        });
        inp[1].addEventListener("input", function (e) {
          a.price = parseInt(e.target.value, 10) || 0; scheduleSave();
        });
        r.querySelector(".vx").addEventListener("click", function () {
          list.splice(ai, 1);
          if (!list.length) delete item.addons;
          scheduleSave();
          paintAddons();
        });
        adBody.appendChild(r);
      });
      var addA = el("button", "btn btn--add", "➕ Qo'shimcha qo'shish");
      addA.addEventListener("click", function () {
        item.addons = item.addons || [];
        item.addons.push({ id: "ad" + uid(), name: "", price: 0 });
        scheduleSave();
        paintAddons();
      });
      adBody.appendChild(addA);
    }
    paintAddons();
    box.appendChild(adCard);

    /* --- Yorliq --- */
    var badges = ["", "Hit", "Yangi", "Achchiq"];
    var labels = { "": "— yo'q —", Hit: "🔥 Hit", Yangi: "✨ Yangi", Achchiq: "🌶 Achchiq" };
    var bCard = el("div", "card");
    var seg = el("div", "seg");
    badges.forEach(function (b) {
      var btn = el("button", (item.badge || "") === b ? "on" : "", labels[b]);
      btn.style.fontSize = "13px";
      btn.addEventListener("click", function () {
        if (b) item.badge = b; else delete item.badge;
        scheduleSave();
        render();
      });
      seg.appendChild(btn);
    });
    var bf = el("div", "f", "<label>Yorliq</label>");
    bf.appendChild(seg);
    bCard.appendChild(bf);
    box.appendChild(bCard);

    var del = el("button", "btn btn--del", "🗑 Mahsulotni o'chirish");
    del.addEventListener("click", function () {

      cat.items.splice(view.ii, 1);

      toast("O'chirildi");

    setTitle("Chegirma kodlari");

    if (promos === null) {
      box.appendChild(el("div", "empty", "Yuklanmoqda…"));
      loadPromos(function () { render(); });
      return;
    }

    box.appendChild(el("div", "card",
      "<p class=\"hint\" style=\"margin:0\">Mijoz savatda kodni kiritadi. " +
      "Foizli (10%) yoki aniq summali (15 000 so'm) bo'lishi mumkin. " +
      "«Minimal summa» — kod ishlashi uchun savatdagi eng kam summa (0 = cheklovsiz).</p>"));

    promos.forEach(function (pr, i) {
      var card = el("div", "card");
      card.innerHTML =
        '<div class="f"><label>Kod</label>' +
        '<input class="pCode" value="' + esc(pr.code || "") + '" placeholder="DONER10" /></div>' +
        '<div class="f"><label>Chegirma turi</label>' +
        '<div class="seg">' +
        '<button class="pPct ' + (pr.type === "fixed" ? "" : "on") + '">Foiz (%)</button>' +
        '<button class="pFix ' + (pr.type === "fixed" ? "on" : "") + '">Summa</button>' +
        "</div></div>" +
        '<div class="f2">' +
        '<div class="f"><label>Qiymati</label>' +
        '<input class="pVal" inputmode="numeric" value="' + (pr.value || 0) + '" /></div>' +
        '<div class="f"><label>Minimal summa</label>' +
        '<input class="pMin" inputmode="numeric" value="' + (pr.minOrder || 0) + '" /></div>' +
        "</div>" +
        '<div class="f"><label>Holati</label><div class="seg">' +
        '<button class="pOn ' + (pr.active === false ? "" : "on") + '">✅ Ishlaydi</button>' +
        '<button class="pOff ' + (pr.active === false ? "on" : "") + '">⏸ To\'xtatilgan</button>' +
        "</div></div>";

      card.querySelector(".pCode").addEventListener("input", function (e) {
        pr.code = e.target.value.toUpperCase(); savePromos();
      });
      card.querySelector(".pVal").addEventListener("input", function (e) {
        pr.value = parseInt(e.target.value, 10) || 0; savePromos();
      });
      card.querySelector(".pMin").addEventListener("input", function (e) {
        pr.minOrder = parseInt(e.target.value, 10) || 0; savePromos();
      });
      card.querySelector(".pPct").addEventListener("click", function () {
        pr.type = "percent"; savePromos(); render();
      });
      card.querySelector(".pFix").addEventListener("click", function () {
        pr.type = "fixed"; savePromos(); render();
      });
      card.querySelector(".pOn").addEventListener("click", function () {
        pr.active = true; savePromos(); render();
      });
      card.querySelector(".pOff").addEventListener("click", function () {
        pr.active = false; savePromos(); render();
      });

      var del = el("button", "btn btn--mini", "🗑 Kodni o'chirish");
      del.style.cssText = "margin-top:6px;background:transparent;color:#e03131;border:1.5px solid rgba(224,49,49,.4)";
      del.addEventListener("click", function () {
        if (!confirm("«" + (pr.code || "") + "» kodi o'chiriladi. Davom etamizmi?")) return;
        promos.splice(i, 1); savePromos(); render();
      });
      card.appendChild(del);
      box.appendChild(card);
    });

    if (!promos.length) box.appendChild(el("div", "empty", "Hali chegirma kodi yo'q"));

    var add = el("button", "btn btn--add", "➕ Kod qo'shish");
    add.addEventListener("click", function () {
      promos.push({ code: "", type: "percent", value: 10, minOrder: 0, active: true });
      savePromos();
      render();
    });
    box.appendChild(add);
  }

  function loadPromos(done) {
    api("get_promos", {}, function (err, res) {
      promos = (!err && res.status === 200 && res.data.codes) ? res.data.codes : [];
      done && done();
    });
  }

  function savePromos() {
    setSaveState("on", "saqlanmoqda…");
    clearTimeout(savePromos._t);
    savePromos._t = setTimeout(function () {
      api("save_promos", { codes: promos }, function (err, res) {
        if (err || res.status !== 200) return setSaveState("bad", "saqlanmadi!");
        var d = new Date();
        setSaveState("ok", "saqlandi " +
          String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"));
      });
    }, 800);
  }

  /* ============ 7. REKLAMA XABARI ============ */
  function renderBroadcast(box) {
    setTitle("Reklama xabari");

    var info = el("div", "card",
      "<p class=\"hint\" style=\"margin:0\">Xabar botdan <b>buyurtma bergan barcha mijozlarga</b> " +
      "yuboriladi. Yuborilgandan keyin qaytarib bo'lmaydi \u2014 matnni diqqat bilan tekshiring.</p>");
    box.appendChild(info);

    var card = el("div", "card");
    card.innerHTML =
      '<div class="f"><label>Xabar matni</label>' +
      '<textarea id="bcText" rows="6" placeholder="Bugun barcha pitsalarga 20% chegirma! 🍕"></textarea>' +
      '<p class="hint">Qalin matn uchun &lt;b&gt;matn&lt;/b&gt; yozishingiz mumkin.</p></div>';
    box.appendChild(card);

    var count = el("div", "empty", "Mijozlar soni aniqlanmoqda…");
    box.appendChild(count);
    api("broadcast_count", {}, function (err, res) {
      count.textContent = (!err && res.status === 200)
        ? res.data.count + " ta mijozga yuboriladi"
        : "Mijozlar sonini aniqlab bo'lmadi";
    });

    var send = el("button", "btn", "📣 Yuborish");
    send.addEventListener("click", function () {
      var text = (document.getElementById("bcText").value || "").trim();
      if (!text) return toast("Xabar matnini yozing");
      if (!confirm("Xabar barcha mijozlarga yuboriladi. Davom etamizmi?\n\n" + text)) return;
      send.disabled = true;
      send.textContent = "Yuborilmoqda…";
      api("broadcast", { text: text }, function (err, res) {
        send.disabled = false;
        send.textContent = "📣 Yuborish";
        if (err || res.status !== 200) {
          return toast("❌ " + ((res && res.data && res.data.error) || "yuborilmadi"));
        }
        document.getElementById("bcText").value = "";
        toast("✅ " + res.data.sent + " ta yuborildi" +
          (res.data.failed ? ", " + res.data.failed + " tasi yetmadi" : ""));
      });
    });
    box.appendChild(send);
  }

  /* ============ 8. «QAYTIB KELING» ESLATMASI ============ */
  function renderFollowup(box) {
    setTitle("Eslatma");

    if (followup === null) {
      box.appendChild(el("div", "empty", "Yuklanmoqda…"));
      api("get_followup", {}, function (err, res) {
        followup = (!err && res.status === 200 && res.data.config)
          ? res.data.config
          : { enabled: true, delayMin: 5, text: "" };
        render();
      });
      return;
    }

    box.appendChild(el("div", "card",
      "<p class=\"hint\" style=\"margin:0\">Mijoz ilovani ochib, hech narsa " +
      "buyurtma qilmasdan chiqib ketsa, belgilangan vaqtdan keyin unga bot " +
      "shu xabarni yuboradi. Bir mijozga kuniga faqat bir marta.</p>"));

    var card = el("div", "card");
    var f1 = el("div", "f", "<label>Holati</label>");
    var seg = el("div", "seg");
    [{ on: true, text: "✅ Yoqilgan" }, { on: false, text: "⏸ O'chirilgan" }].forEach(function (o) {
      var btn = el("button", followup.enabled === o.on ? "on" : "", o.text);
      btn.addEventListener("click", function () {
        followup.enabled = o.on; saveFollowup(); render();
      });
      seg.appendChild(btn);
    });
    f1.appendChild(seg);
    card.appendChild(f1);

    var f2 = el("div", "f",
      "<label>Necha daqiqadan keyin yuborilsin</label>" +
      '<input id="fuDelay" inputmode="numeric" value="' + (followup.delayMin || 5) + '" />' +
      '<p class="hint">Namunadagidek 5 daqiqa tavsiya etiladi. Eng ko\'pi — 720 (12 soat).</p>');
    card.appendChild(f2);

    var f3 = el("div", "f",
      "<label>Xabar matni</label>" +
      '<textarea id="fuText" rows="4"></textarea>');
    card.appendChild(f3);
    box.appendChild(card);

    card.querySelector("#fuDelay").addEventListener("input", function (e) {
      followup.delayMin = parseInt(e.target.value, 10) || 5; saveFollowup();
    });
    var ta = card.querySelector("#fuText");
    ta.value = followup.text || "";
    ta.addEventListener("input", function (e) {
      followup.text = e.target.value; saveFollowup();
    });
  }

  function saveFollowup() {
    setSaveState("on", "saqlanmoqda…");
    clearTimeout(saveFollowup._t);
    saveFollowup._t = setTimeout(function () {
      api("save_followup", { config: followup }, function (err, res) {
        if (err || res.status !== 200) return setSaveState("bad", "saqlanmadi!");
        var d = new Date();
        setSaveState("ok", "saqlandi " +
          String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"));
      });
    }, 800);
  }

  /* ============================================================
     Rasm yuklash — qo'lda kesish (crop) oynasi bilan
       1. Fayl ochiladi, telefon rasmidagi burilish (EXIF) to'g'rilanadi
       2. Foydalanuvchi surib / kattalashtirib kvadrat ramkaga moslaydi
       3. «Kesish» bosilganda faqat ramka ichidagi qism 800×800 qilib
          serverga yuboriladi
     ============================================================ */

  var OUT_SIZE = 800;
  var cropState = null;

  // Rasmni burilishi to'g'rilangan holda yuklaydi
  function loadImage(file, ok, fail) {
    if (window.createImageBitmap) {
      createImageBitmap(file, { imageOrientation: "from-image" })
        .then(ok)
        .catch(function () { loadViaTag(file, ok, fail); });
      return;
    }
    loadViaTag(file, ok, fail);
  }

  function loadViaTag(file, ok, fail) {
    var reader = new FileReader();
    reader.onerror = fail;
    reader.onload = function () {
      var img = new Image();
      img.onload = function () { ok(img); };
      img.onerror = fail;
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  // Faylni ochib, kesish oynasini ko'rsatadi. onDone(url) — «Kesish»
  // muvaffaqiyatli bo'lganda chaqiriladi; Bekor qilinsa umuman chaqirilmaydi.
  function openCropper(file, onDone) {
    loadImage(
      file,
      function (src) {
        // Burilishi to'g'rilangan holda bitta canvas'ga tushiramiz —
        // shu canvas ham preview, ham yakuniy kesish uchun manba bo'ladi
        var w = src.width, h = src.height;
        var canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(src, 0, 0, w, h);
        if (src.close) src.close();
        startCropUI(canvas, onDone);
      },
      function () { toast("Rasmni ochib bo'lmadi"); }
    );
  }

  function startCropUI(canvas, onDone) {
    var overlay = document.getElementById("cropOverlay");
    var frame = document.getElementById("cropFrame");
    var imgEl = document.getElementById("cropImg");
    var zoomInput = document.getElementById("cropZoom");

    imgEl.src = canvas.toDataURL("image/jpeg", 0.9);
    overlay.hidden = false;
    document.body.style.overflow = "hidden";

    requestAnimationFrame(function () {
      var fw = frame.clientWidth, fh = frame.clientHeight;
      var minScale = Math.max(fw / canvas.width, fh / canvas.height);
      cropState = {
        canvas: canvas, onDone: onDone,
        natW: canvas.width, natH: canvas.height,
        fw: fw, fh: fh,
        minScale: minScale, maxScale: minScale * 4, scale: minScale,
        tx: (fw - canvas.width * minScale) / 2,
        ty: (fh - canvas.height * minScale) / 2,
      };
      zoomInput.value = 0;
      applyCropTransform();
    });
  }

  function clampCropOffset() {
    var s = cropState;
    var w = s.natW * s.scale, h = s.natH * s.scale;
    var minTx = Math.min(0, s.fw - w);
    var minTy = Math.min(0, s.fh - h);
    if (s.tx > 0) s.tx = 0;
    if (s.tx < minTx) s.tx = minTx;
    if (s.ty > 0) s.ty = 0;
    if (s.ty < minTy) s.ty = minTy;
  }

  function applyCropTransform() {
    if (!cropState) return;
    clampCropOffset();
    var img = document.getElementById("cropImg");
    img.style.width = cropState.natW + "px";
    img.style.height = cropState.natH + "px";
    img.style.transform =
      "translate(" + cropState.tx + "px," + cropState.ty + "px) scale(" + cropState.scale + ")";
  }

  // Ramkadagi (fx, fy) nuqta rasmning bir xil joyida qolgan holda kattalashtiradi
  function setCropScale(newScale, fx, fy) {
    var s = cropState;
    newScale = Math.max(s.minScale, Math.min(s.maxScale, newScale));
    var imgX = (fx - s.tx) / s.scale;
    var imgY = (fy - s.ty) / s.scale;
    s.scale = newScale;
    s.tx = fx - imgX * newScale;
    s.ty = fy - imgY * newScale;
    applyCropTransform();
    document.getElementById("cropZoom").value = Math.round(
      ((s.scale - s.minScale) / (s.maxScale - s.minScale || 1)) * 100
    );
  }

  /* ---- Surish (1 barmoq) va siqib-kattalashtirish (2 barmoq) ---- */
  (function () {
    var stage = document.getElementById("cropStage");
    var pointers = {};
    var dragStart = null;
    var pinchStart = null;

    function frameXY(clientX, clientY) {
      var r = document.getElementById("cropFrame").getBoundingClientRect();
      return { x: clientX - r.left, y: clientY - r.top };
    }

    stage.addEventListener("pointerdown", function (e) {
      if (!cropState) return;
      stage.setPointerCapture(e.pointerId);
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pointers);
      if (ids.length === 1) {
        dragStart = { x: e.clientX, y: e.clientY, tx: cropState.tx, ty: cropState.ty };
        pinchStart = null;
      } else if (ids.length === 2) {
        dragStart = null;
        var p = ids.map(function (id) { return pointers[id]; });
        var dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
        var fxy = frameXY((p[0].x + p[1].x) / 2, (p[0].y + p[1].y) / 2);
        pinchStart = { dist: dist, scale: cropState.scale, fx: fxy.x, fy: fxy.y };
      }
    });

    stage.addEventListener("pointermove", function (e) {
      if (!cropState || !pointers[e.pointerId]) return;
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pointers);
      if (ids.length === 1 && dragStart) {
        cropState.tx = dragStart.tx + (e.clientX - dragStart.x);
        cropState.ty = dragStart.ty + (e.clientY - dragStart.y);
        applyCropTransform();
      } else if (ids.length === 2 && pinchStart) {
        var p = ids.map(function (id) { return pointers[id]; });
        var dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
        setCropScale(pinchStart.scale * (dist / (pinchStart.dist || 1)), pinchStart.fx, pinchStart.fy);
      }
    });

    function endPointer(e) {
      delete pointers[e.pointerId];
      var ids = Object.keys(pointers);
      if (ids.length === 1 && cropState) {
        var p = pointers[ids[0]];
        dragStart = { x: p.x, y: p.y, tx: cropState.tx, ty: cropState.ty };
        pinchStart = null;
      } else {
        dragStart = null;
        pinchStart = null;
      }
    }
    stage.addEventListener("pointerup", endPointer);
    stage.addEventListener("pointercancel", endPointer);

    // Sichqoncha g'ildiragi — kompyuterda sinash uchun qulay
    stage.addEventListener("wheel", function (e) {
      if (!cropState) return;
      e.preventDefault();
      var fxy = frameXY(e.clientX, e.clientY);
      setCropScale(cropState.scale * (e.deltaY < 0 ? 1.08 : 0.92), fxy.x, fxy.y);
    }, { passive: false });
  })();

  document.getElementById("cropZoom").addEventListener("input", function (e) {
    if (!cropState) return;
    var s = cropState;
    setCropScale(s.minScale + (s.maxScale - s.minScale) * (e.target.value / 100), s.fw / 2, s.fh / 2);
  });

  function closeCropper() {
    document.getElementById("cropOverlay").hidden = true;
    document.body.style.overflow = "";
    cropState = null;
  }

  document.getElementById("cropCancel").addEventListener("click", closeCropper);

  document.getElementById("cropConfirm").addEventListener("click", function () {
    if (!cropState) return;
    var s = cropState;
    var onDone = s.onDone;
    var sx = -s.tx / s.scale, sy = -s.ty / s.scale;
    var sw = s.fw / s.scale, sh = s.fh / s.scale;

    var out = document.createElement("canvas");
    out.width = OUT_SIZE;
    out.height = OUT_SIZE;
    out.getContext("2d").drawImage(s.canvas, sx, sy, sw, sh, 0, 0, OUT_SIZE, OUT_SIZE);

    closeCropper();
    var base64 = out.toDataURL("image/jpeg", 0.85).split(",")[1];
    api("upload_image", {
      filename: "photo.jpg", content_type: "image/jpeg", data_base64: base64,
    }, function (err, res) {
      onDone(!err && res.status === 200 && res.data.url ? res.data.url : "");
    });
  });
})();
</script>
</body>
</html>
