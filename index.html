<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>DonDoner — Menyu</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- ?v= raqamini har yangilanishda oshiring — kesh muammosini oldini oladi -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/style.css?v=13" />
</head>
<body>
  <!-- ======== BOSH SAHIFA ======== -->
  <section class="page page--home is-active" id="page-home">
    <header class="topbar">
      <img
        class="topbar__logoimg"
        src="images/logo-wide.png"
        alt="DonDöner — Turkcha ishtaha, O'zbekona mehmondo'stlik"
      />
      <button class="iconbtn iconbtn--ondark" id="searchBtn" aria-label="Qidirish">🔍</button>
    </header>

    <!-- Yetkazish / olib ketish -->
    <div class="delivery">
      <div class="delivery__info">
        <span class="delivery__label">Manzil</span>
        <span class="delivery__value" id="deliveryAddr">Manzilni tanlang…</span>
      </div>
      <div class="segmented" id="modeToggle">
        <button class="segmented__btn is-active" data-mode="delivery">Yetkazish</button>
        <button class="segmented__btn" data-mode="pickup">Olib ketish</button>
      </div>
    </div>

    <!-- Qidiruv (yashirin, tugma bosilganda ochiladi) -->
    <div class="searchbar" id="searchBar" hidden>
      <input type="search" id="searchInput" placeholder="Taom qidirish…" autocomplete="off" />
    </div>

    <!-- Kategoriya chiplar -->
    <nav class="chips" id="chips" aria-label="Kategoriyalar"></nav>

    <!-- Menyu bo'limlari -->
    <main class="menu" id="menu"></main>

    <footer class="footer" id="footer"></footer>
  </section>

  <!-- ======== SAVAT ======== -->
  <section class="page page--cart" id="page-cart">
    <header class="pagehead"><h2>Savat</h2></header>
    <div class="cart" id="cartBody"></div>
  </section>

  <!-- ======== BUYURTMALAR ======== -->
  <section class="page page--orders" id="page-orders">
    <header class="pagehead"><h2>Buyurtmalar</h2></header>
    <div class="orders" id="ordersBody"></div>
  </section>

  <!-- ======== PROFIL ======== -->
  <section class="page page--profile" id="page-profile">
    <header class="pagehead"><h2>Profil</h2></header>
    <div class="profile" id="profileBody"></div>
  </section>

  <!-- ======== PASTKI NAVIGATSIYA ======== -->
  <nav class="tabbar" id="tabbar">
    <button class="tabbar__btn is-active" data-page="home">
      <span class="tabbar__icon">🏠</span><span class="tabbar__label">Bosh sahifa</span>
    </button>
    <button class="tabbar__btn" data-page="cart">
      <span class="tabbar__icon">🛒</span><span class="tabbar__label">Savat</span>
      <span class="tabbar__badge" id="cartBadge" hidden>0</span>
    </button>
    <button class="tabbar__btn" data-page="orders">
      <span class="tabbar__icon">📋</span><span class="tabbar__label">Buyurtmalar</span>
    </button>
    <button class="tabbar__btn" data-page="profile">
      <span class="tabbar__icon">👤</span><span class="tabbar__label">Profil</span>
    </button>
  </nav>

  <!-- ======== TAOM TAFSILOTI (bottom sheet) ======== -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true">
      <button class="sheet__close" data-close aria-label="Yopish">✕</button>
      <div class="sheet__media" id="sheetMedia"></div>
      <div class="sheet__body">
        <div class="sheet__row">
          <h2 class="sheet__title" id="sheetTitle"></h2>
          <span class="sheet__price" id="sheetPrice"></span>
        </div>
        <p class="sheet__weight" id="sheetWeight"></p>
        <p class="sheet__desc" id="sheetDesc"></p>
        <div class="sheet__variants" id="sheetVariants" hidden></div>
        <button class="btn btn--primary sheet__add" id="sheetAdd">Savatga qo'shish</button>
      </div>
    </div>
  </div>

  <!-- ======== MANZIL TANLASH (to'liq ekran) ======== -->
  <section class="picker" id="picker" hidden>
    <header class="picker__head">
      <button class="picker__back" id="pickerBack" aria-label="Orqaga">←</button>
      <h2 class="picker__title">Yangi manzil</h2>
    </header>

    <div class="picker__search">
      <input
        type="search"
        id="pickerInput"
        placeholder="Manzilni kiriting"
        autocomplete="off"
      />
      <ul class="picker__results" id="pickerResults" hidden></ul>
    </div>

    <div class="picker__map" id="pickerMap">
      <!-- Markazdagi qo'zg'almas nuqta: xaritani surasiz, nuqta joyida qoladi -->
      <div class="picker__pin" aria-hidden="true"></div>
      <button class="picker__locate" id="pickerLocate" aria-label="Meni topish">➤</button>
    </div>

    <div class="picker__foot">
      <div class="picker__addr" id="pickerAddr">Manzil aniqlanmoqda…</div>
      <button class="btn btn--primary" id="pickerDone">Davom etish</button>
    </div>
  </section>

  <!-- ======== ICHKI EKRAN (Filiallar, Biz haqimizda, ...) ======== -->
  <section class="subpage" id="subpage" hidden>
    <header class="subpage__head">
      <button class="subpage__back" id="subBack" aria-label="Orqaga">←</button>
      <h2 class="subpage__title" id="subTitle"></h2>
    </header>
    <div class="subpage__body" id="subBody"></div>
  </section>

  <!-- ======== TOAST ======== -->
  <div class="toast" id="toast" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="data/i18n.js?v=13"></script>
  <script src="data/menu.js?v=13"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
